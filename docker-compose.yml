# Local / developer Docker stack.
# Requires a root `.env` (copy from `.env.example`) with SECRET_KEY and POSTGRES_PASSWORD.
# Compose does not embed production secrets; values are substituted from the environment.
#
# Real-time bid broadcasts use Django Channels + Redis (REDIS_URL).
# WebSockets require the ASGI server (Daphne), not gunicorn/WSGI.
# Automatic expired-auction closing uses Celery worker + Beat (Redis broker).

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-bidkori_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bidkori}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  CELERY_CLOSE_EXPIRED_INTERVAL_SECONDS: ${CELERY_CLOSE_EXPIRED_INTERVAL_SECONDS:-10}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  DEBUG: ${DEBUG:-True}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
  AI_LISTING_RATE: ${AI_LISTING_RATE:-5/minute}
  AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
  AI_CHAT_RATE: ${AI_CHAT_RATE:-10/minute}

services:
  db:
    image: postgres:15-alpine
    container_name: bidkori_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bidkori}
      POSTGRES_USER: ${POSTGRES_USER:-bidkori_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bind to loopback only — not exposed on all interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bidkori_user} -d ${POSTGRES_DB:-bidkori}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bidkori_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: bidkori_web
    command: >-
      sh -c "python manage.py migrate &&
      daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "8000:8000"
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  worker:
    build: .
    container_name: bidkori_worker
    command: celery -A config worker -l INFO
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  beat:
    build: .
    container_name: bidkori_beat
    command: celery -A config beat -l INFO
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
