$kind: http-request
description: Authenticate with username and password. Saves the returned token to {{authToken}}.
url: "{{baseUrl}}/api/users/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "buyer_one",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var data = pm.response.json();
          if (data.token) {
              pm.collectionVariables.set('authToken', data.token);
          }
      }
    language: text/javascript
order: 2000
