openapi: 3.0.3
info:
  title: BidKori API
  version: 3.0.0
  description: Real-time auction platform backend API documentation
paths:
  /api/auctions/:
    get:
      operationId: auctions_list
      description: |-
        List, create, retrieve, update, and delete auctions.

        Accepts JSON and multipart/form-data so listing images can be uploaded
        alongside auction creation (field name: ``images``).
      summary: List auctions
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Filter by product category name or slug.
      - in: query
        name: search
        schema:
          type: string
        description: Search product title and description (case-insensitive).
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
          - CLOSED
        description: Filter by auction status (ACTIVE, CLOSED, CANCELLED).
      tags:
      - Auctions
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auction'
          description: ''
    post:
      operationId: auctions_create
      description: |-
        List, create, retrieve, update, and delete auctions.

        Accepts JSON and multipart/form-data so listing images can be uploaded
        alongside auction creation (field name: ``images``).
      summary: Create an auction (JSON or multipart with images)
      tags:
      - Auctions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auction'
          multipart/form-data:
            schema:
              type: object
              properties:
                product:
                  type: object
                starting_bid:
                  type: string
                  format: decimal
                min_increment:
                  type: string
                  format: decimal
                reserve_price:
                  type: string
                  format: decimal
                start_time:
                  type: string
                  format: date-time
                end_time:
                  type: string
                  format: date-time
                is_featured:
                  type: boolean
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Optional auction images (multipart).
              required:
              - product
              - starting_bid
              - start_time
              - end_time
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auction'
          description: ''
  /api/auctions/{auction_id}/history/:
    get:
      operationId: auctions_history_list
      description: Return all bids for an auction, ordered by highest amount first.
      summary: List bid history for an auction
      parameters:
      - in: path
        name: auction_id
        schema:
          type: integer
        required: true
      tags:
      - Bidding
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bid'
          description: ''
  /api/auctions/{auction_id}/images/:
    post:
      operationId: auctions_images_create
      description: Upload one or more binary image files via multipart/form-data.
      summary: Upload auction images
      parameters:
      - in: path
        name: auction_id
        schema:
          type: integer
        required: true
      tags:
      - Auctions
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Image files to attach to the auction.
              required:
              - images
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuctionImage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: ''
  /api/auctions/{auction_id}/place-bid/:
    post:
      operationId: auctions_place_bid_create
      description: |-
        Place a bid on an active auction.

        Validates active status and that the bid beats the current highest bid.
        Sellers cannot bid on their own auctions. Bid writes run atomically under
        ``select_for_update`` to prevent concurrent race conditions.
      summary: Place a bid on an auction
      parameters:
      - in: path
        name: auction_id
        schema:
          type: integer
        required: true
      tags:
      - Bidding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBidRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlaceBidRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlaceBidRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bid'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: ''
  /api/auctions/{id}/:
    get:
      operationId: auctions_retrieve
      description: |-
        List, create, retrieve, update, and delete auctions.

        Accepts JSON and multipart/form-data so listing images can be uploaded
        alongside auction creation (field name: ``images``).
      summary: Retrieve an auction
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Auctions
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auction'
          description: ''
    put:
      operationId: auctions_update
      description: |-
        List, create, retrieve, update, and delete auctions.

        Accepts JSON and multipart/form-data so listing images can be uploaded
        alongside auction creation (field name: ``images``).
      summary: Update an auction
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Auctions
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Auction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Auction'
          application/json:
            schema:
              $ref: '#/components/schemas/Auction'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auction'
          description: ''
    patch:
      operationId: auctions_partial_update
      description: |-
        List, create, retrieve, update, and delete auctions.

        Accepts JSON and multipart/form-data so listing images can be uploaded
        alongside auction creation (field name: ``images``).
      summary: Partially update an auction
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Auctions
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAuction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAuction'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAuction'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auction'
          description: ''
    delete:
      operationId: auctions_destroy
      description: |-
        List, create, retrieve, update, and delete auctions.

        Accepts JSON and multipart/form-data so listing images can be uploaded
        alongside auction creation (field name: ``images``).
      summary: Delete an auction
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Auctions
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auctions/{id}/transition/:
    post:
      operationId: auctions_transition_create
      description: Transition an auction to a new status via the state machine.
      summary: Transition auction status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Auctions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionStatus'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransitionStatus'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransitionStatus'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auction'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: ''
  /api/auctions/active/:
    get:
      operationId: auctions_active_list
      description: Return auctions that are ACTIVE and have not yet reached end_time.
      summary: List active auctions
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Filter by product category name or slug.
      - in: query
        name: search
        schema:
          type: string
        description: Search product title and description.
      tags:
      - Auctions
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuctionDetail'
          description: ''
  /api/auctions/analytics/:
    get:
      operationId: auctions_analytics_retrieve
      description: Aggregate auction and bidding metrics for dashboards and reporting.
      summary: Auction analytics summary
      tags:
      - Analytics
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auctions/my-bids/:
    get:
      operationId: auctions_my_bids_list
      description: Return all bids placed by the authenticated user, with auction
        details.
      summary: List bids placed by the authenticated user
      tags:
      - Bidding
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bid'
          description: ''
  /api/products/:
    get:
      operationId: products_list
      description: List all products or create a new one for the authenticated user.
      tags:
      - products
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
    post:
      operationId: products_create
      description: List all products or create a new one for the authenticated user.
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/products/{id}/:
    get:
      operationId: products_retrieve
      description: |-
        Retrieve, update, or delete a single product by its primary key.

        PUT, PATCH, and DELETE are restricted to the product seller via
        IsSellerOrReadOnly.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    put:
      operationId: products_update
      description: |-
        Retrieve, update, or delete a single product by its primary key.

        PUT, PATCH, and DELETE are restricted to the product seller via
        IsSellerOrReadOnly.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_partial_update
      description: |-
        Retrieve, update, or delete a single product by its primary key.

        PUT, PATCH, and DELETE are restricted to the product seller via
        IsSellerOrReadOnly.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: products_destroy
      description: |-
        Retrieve, update, or delete a single product by its primary key.

        PUT, PATCH, and DELETE are restricted to the product seller via
        IsSellerOrReadOnly.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/products/my-listings/:
    get:
      operationId: products_my_listings_list
      description: Return all products listed by the authenticated user.
      tags:
      - products
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
