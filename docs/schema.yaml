  /api/users/login/:
    post:
      operationId: users_login_create
      description: Authenticate with username/password and return an auth token.
      summary: Log in and obtain an auth token
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Username and password are required.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Invalid credentials.
          description: ''
  /api/users/me/:
    get:
      operationId: users_me_retrieve
      description: Return the currently authenticated user's profile.
      summary: Get the authenticated user profile
      tags:
      - Users
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/register/:
    post:
      operationId: users_register_create
      description: Register a new user and return an auth token with user details.
      summary: Register a new user
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
          description: ''
components:
  schemas:
    Auction:
      type: object
      description: |-
        Serializes an auction with its nested product and images.

        Supports creating a product and its auction in a single request; the
        seller is taken from the authenticated request user. Optional multipart
        image uploads may be sent as ``images`` (one or more files).
      properties:
        id:
          type: integer
          readOnly: true
        product:
          $ref: '#/components/schemas/Product'
        starting_bid:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        current_highest_bid:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        min_increment:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        reserve_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        winning_bidder:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        is_featured:
          type: boolean
        images:
          type: array
          items:
            $ref: '#/components/schemas/AuctionImage'
          readOnly: true
        uploaded_images:
          type: array
          items:
            type: string
            format: uri
          writeOnly: true
          description: 'One or more image files (multipart/form-data field name: images).'
      required:
      - current_highest_bid
      - end_time
      - id
      - images
      - product
      - start_time
      - starting_bid
      - status
      - winning_bidder
    AuctionDetail:
      type: object
      description: Detailed auction payload including product labels and recent bids.
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          readOnly: true
        product_title:
          type: string
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
        end_time:
          type: string
          format: date-time
          readOnly: true
        current_highest_bid:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        winning_bidder_username:
          type: string
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        is_active:
          type: string
          readOnly: true
        recent_bids:
          type: string
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/AuctionImage'
          readOnly: true
      required:
      - current_highest_bid
      - end_time
      - id
      - images
      - is_active
      - product
      - product_title
      - recent_bids
      - start_time
      - status
      - winning_bidder_username
    AuctionImage:
      type: object
      description: Serializes an uploaded auction listing image.
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - image
      - uploaded_at
    AuthTokenResponse:
      type: object
      description: Schema for login/register responses containing a token and user.
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - token
      - user
    Bid:
      type: object
      description: Serializes a bid for frontend display.
      properties:
        id:
          type: integer
          readOnly: true
        auction:
          type: integer
          readOnly: true
        bidder_username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - auction
      - bidder_username
      - id
      - timestamp
    ConditionEnum:
      enum:
      - NEW
      - USED_LIKE_NEW
      - USED_GOOD
      - FAIR
      type: string
      description: |-
        * `NEW` - Brand New
        * `USED_LIKE_NEW` - Used - Like New
        * `USED_GOOD` - Used - Good
        * `FAIR` - Fair Condition
    ErrorMessage:
      type: object
      description: Generic error payload used by custom API views.
      properties:
        error:
          type: string
        detail:
          type: string
    LoginRequest:
      type: object
      description: Schema for username/password login requests.
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    PatchedAuction:
      type: object
      description: |-
        Serializes an auction with its nested product and images.

        Supports creating a product and its auction in a single request; the
        seller is taken from the authenticated request user. Optional multipart
        image uploads may be sent as ``images`` (one or more files).
      properties:
        id:
          type: integer
          readOnly: true
        product:
          $ref: '#/components/schemas/Product'
        starting_bid:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        current_highest_bid:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        min_increment:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        reserve_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        winning_bidder:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        is_featured:
          type: boolean
        images:
          type: array
          items:
            $ref: '#/components/schemas/AuctionImage'
          readOnly: true
        uploaded_images:
          type: array
          items:
            type: string
            format: uri
          writeOnly: true
          description: 'One or more image files (multipart/form-data field name: images).'
    PatchedProduct:
      type: object
      description: Serializes a product listing, attaching the seller from the request.
      properties:
        id:
          type: integer
          readOnly: true
        seller:
          type: integer
          readOnly: true
        category:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PlaceBidRequest:
      type: object
      description: Request body for placing a bid on an auction.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - amount
    Product:
      type: object
      description: Serializes the core details of a product listing.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        category:
          type: integer
          nullable: true
      required:
      - id
      - title
    StatusEnum:
      enum:
      - ACTIVE
      - CLOSED
      - CANCELLED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `CLOSED` - Closed
        * `CANCELLED` - Cancelled
    TransitionStatus:
      type: object
      description: Request body for auction status transitions.
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    User:
      type: object
      description: Returns basic public user profile information.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
      - username
    UserRegistration:
      type: object
      description: Handles new user registration with password confirmation.
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - confirm_password
      - password
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
